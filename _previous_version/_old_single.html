<title>BrandGuard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with tabs; Review is two columns (draft | findings), other tabs are single-column lists. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#15202B; --muted:#5A6878; --line:#D9DFE6;
  --accent:#0F6B78; --accent-ink:#FFFFFF; --accent-soft:#E1F1F3;
  --hi:#B3261E; --hi-bg:#FCE9E7; --med:#9A5B00; --med-bg:#FDF1DC; --lo:#2F5D9A; --lo-bg:#E5EEF9;
  --ok:#1E7A46; --ok-bg:#E2F3E9; --ins:#DDF3E4; --del:#FBE0DD;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1519; --surface:#172027; --ink:#E6ECF1; --muted:#98A6B3; --line:#2A3641;
    --accent:#5CC0CF; --accent-ink:#06262B; --accent-soft:#17323A;
    --hi:#FF8F86; --hi-bg:#3A1C1A; --med:#F2B35C; --med-bg:#38290F; --lo:#8DB6EA; --lo-bg:#182A40;
    --ok:#6FD39A; --ok-bg:#15301F; --ins:#1B3A28; --del:#41201E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1519; --surface:#172027; --ink:#E6ECF1; --muted:#98A6B3; --line:#2A3641;
  --accent:#5CC0CF; --accent-ink:#06262B; --accent-soft:#17323A;
  --hi:#FF8F86; --hi-bg:#3A1C1A; --med:#F2B35C; --med-bg:#38290F; --lo:#8DB6EA; --lo-bg:#182A40;
  --ok:#6FD39A; --ok-bg:#15301F; --ins:#1B3A28; --del:#41201E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:20px} h3{font-size:15.5px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tab:hover{color:var(--ink)}
.count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rolenote{font-size:12px;color:var(--muted)}

main{padding-block:20px 8px}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel + .panel{margin-top:16px}
.grid2 > .panel + .panel{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{resize:vertical;line-height:1.55}
#draft{min-height:210px;font-family:var(--f-body)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){color:var(--accent-ink);filter:brightness(1.08)}
.btn.danger:hover:not(:disabled){border-color:var(--hi);color:var(--hi)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.high{background:var(--hi-bg);color:var(--hi)} .pill.medium{background:var(--med-bg);color:var(--med)}
.pill.low{background:var(--lo-bg);color:var(--lo)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.chip{font-family:var(--f-mono);font-size:12px;padding:1px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}

/* marked-up draft */
.marked{white-space:pre-wrap;word-break:break-word;border:1px dashed var(--line);border-radius:6px;padding:10px 12px;background:var(--bg);line-height:1.7}
mark{border-radius:3px;padding:1px 2px;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
mark.high{background:var(--hi-bg);text-decoration-color:var(--hi)}
mark.medium{background:var(--med-bg);text-decoration-color:var(--med)}
mark.low{background:var(--lo-bg);text-decoration-color:var(--lo)}
mark.disputed{background:transparent;text-decoration-style:dotted}

/* findings */
.summary{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);border-left-width:4px}
.card.high{border-left-color:var(--hi)} .card.medium{border-left-color:var(--med)} .card.low{border-left-color:var(--lo)}
.card.disputed{border-left-color:var(--muted);opacity:.92}
.card + .card{margin-top:10px}
.card.flash{box-shadow:0 0 0 2px var(--accent)}
.quote{font-family:var(--f-mono);font-size:12.5px;background:var(--bg);padding:2px 6px;border-radius:4px;word-break:break-word;white-space:pre-wrap}
.src{border-left:2px solid var(--line);padding-left:10px;color:var(--muted);font-size:13px}
.diff{background:var(--bg);border-radius:6px;padding:8px 10px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
del{background:var(--del);text-decoration:line-through;border-radius:2px;padding:0 1px}
ins{background:var(--ins);text-decoration:none;border-radius:2px;padding:0 1px}
.sec{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.note{padding:9px 12px;border-radius:6px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.note.warn{background:var(--med-bg)}
.toast{min-height:20px;font-size:13px;color:var(--accent);margin-top:8px}

/* lists and tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.list{list-style:none;margin:0;padding:0}
.doc{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.doc + .doc{margin-top:8px}
.doc[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;align-items:center;gap:10px;font-size:13px}
.track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:5px}
.kpis{display:flex;flex-wrap:wrap;gap:24px 40px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
details.add{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.add summary{cursor:pointer;font-weight:600;color:var(--accent)}
.audit{font-size:13px;color:var(--muted)}
.audit li{padding:3px 0}
footer{margin-top:24px;padding-block:16px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:grid;gap:4px}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .2s}}
</style>

<div id="app" class="wrap"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var LS_KEY='brandguard.v2';
var NOW=new Date();
var TODAY=NOW.toISOString().slice(0,10);
function isoPlus(days){return new Date(NOW.getTime()+days*864e5).toISOString().slice(0,10);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function cap(orig,repl,text,idx){
  var start=idx===0||/(^|[.!?\n])\s*$/.test(text.slice(0,idx));
  return start&&/^[a-z]/.test(repl)?repl[0].toUpperCase()+repl.slice(1):repl;
}
function fmt(iso){try{return new Date(iso).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});}catch(e){return iso;}}
function sevRank(s){return s==='high'?0:s==='medium'?1:2;}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function $(id){return document.getElementById(id);}

var mem=null;
function loadState(){
  try{var raw=localStorage.getItem(LS_KEY);if(raw)return JSON.parse(raw);}catch(e){}
  return mem?JSON.parse(mem):null;
}
function saveState(){
  var s=JSON.stringify(S);mem=s;
  try{localStorage.setItem(LS_KEY,s);}catch(e){}
}

/* ---------- seed data: a fictional brand pack ---------- */
var SAMPLE_DRAFT=
"We are India's #1 learning platform and we guarantee 100% results! Over 52,000 learners already study with us, and students love our chatbot. Pick from 150 courses at a super cheap price of just ₹299 a month. Gonna be the best decision you make this year!!!\n\n"+
"Click here: https://northwind.example/join\n\n"+
"<img src=\"team-photo.jpg\">";

function seedRules(){
  return {
    company:'Northwind Learn (fictional demo brand)',
    guidelines:[
      {id:'G-01',title:'Warm, professional tone',text:'Write in a warm, professional voice. No slang or intensifiers like "super". At most one exclamation mark per post.',check:'tone',category:'Tone'},
      {id:'G-02',title:'No guaranteed outcomes',text:'Never promise guaranteed, risk-free or 100% outcomes.',check:'absolutes',category:'Claims'},
      {id:'G-03',title:'Plain sentences',text:'Keep sentences under 25 words so they are easy to read.',check:'readability',category:'Readability'},
      {id:'G-04',title:'Accessible media and links',text:'Every image needs alt text. Link text must say where the link goes, never "click here".',check:'a11y',category:'Accessibility'}
    ],
    terms:[
      {id:'T-01',avoid:'student(s)',pattern:'student(s?)',good:'learner$1',text:'Say "learner", not "student".'},
      {id:'T-02',avoid:'cheap',pattern:'cheap',good:'affordable',text:'Say "affordable", not "cheap".'},
      {id:'T-03',avoid:'chatbot',pattern:'chatbot',good:'AI Coach',text:'Our tutoring assistant is called "AI Coach", not "chatbot".'}
    ],
    facts:[
      {id:'F-01',subject:'Learner count',value:'48,000',display:'48,000 learners',pattern:'(\\d[\\d,]*)\\+?\\s+learners',owner:'Growth team',expires:'2027-03-31'},
      {id:'F-02',subject:'Monthly price',value:'499',display:'₹499 per month',pattern:'₹\\s?(\\d[\\d,]*)',owner:'Finance',expires:'2026-09-30'},
      {id:'F-03',subject:'Course count',value:'120',display:'120 courses',pattern:'(\\d[\\d,]*)\\+?\\s+courses',owner:'Content team',expires:isoPlus(20)}
    ],
    claims:[
      {id:'C-01',label:'Market ranking',pattern:"(?:india['’]s\\s+)?(?:#\\s?1|no\\.\\s?1|number\\s+one)|best\\s+in\\s+india|market\\s+leader",evidence:'',fix:'a trusted',text:'Ranking claims need third-party evidence on file and a reviewer sign-off.'},
      {id:'C-02',label:'Proven results',pattern:'clinically\\s+proven|scientifically\\s+proven|proven\\s+to',evidence:'',fix:'designed around learning research to',text:'"Proven" claims need a cited study on file.'}
    ]
  };
}
function seedEvents(){
  var d=function(n){return new Date(NOW.getTime()-n*864e5).toISOString();};
  var e=[];
  function add(rule,cat,outcome,n,reason){e.push({ruleId:rule,category:cat,outcome:outcome,at:d(n),reason:reason||'',sample:true});}
  add('G-01','Tone','disputed',9,'Slang is part of our festive campaign voice.');
  add('G-01','Tone','disputed',7,'"Super" is how our learners talk. Unclear if it is banned.');
  add('G-01','Tone','disputed',5,'Is a single exclamation mark in a headline allowed?');
  add('G-01','Tone','accepted',4);
  add('G-03','Readability','disputed',8,'Legal disclaimer sentences are long by design.');
  add('G-03','Readability','disputed',6,'Course titles count as one long sentence.');
  add('G-03','Readability','accepted',3);
  add('G-02','Claims','accepted',10);add('G-02','Claims','accepted',8);add('G-02','Claims','accepted',2);add('G-02','Claims','disputed',1,'Refund policy wording says "guaranteed refund".');
  add('T-01','Terminology','accepted',10);add('T-01','Terminology','accepted',9);add('T-01','Terminology','accepted',6);add('T-01','Terminology','accepted',2);
  add('C-01','Claims','accepted',7);add('C-01','Claims','accepted',3);add('C-01','Claims','accepted',1);
  add('F-02','Facts','accepted',5);add('F-02','Facts','accepted',2);
  add('G-04','Accessibility','accepted',6);add('G-04','Accessibility','accepted',4);
  return e;
}
function seedDocs(){
  var t=function(n){return new Date(NOW.getTime()-n*36e5).toISOString();};
  return [
    {id:'d-s1',sample:true,title:'Festive offer email',type:'Email',status:'In review',
     versions:[{n:1,text:'Join Northwind Learn this festive season. Our AI Coach and 120 courses help every learner build a skill at an affordable ₹499 per month. No-brainer! Start today.',at:t(20),by:'Creator',summary:{high:0,disputed:1,resolved:3,openList:[],disputedList:[{ruleId:'G-01',quote:'No-brainer',reason:'Festive campaign voice.'}]}}],
     comments:[{by:'Creator',text:'Disputed the slang flag. This is the campaign tagline.',at:t(19)}],
     audit:[{at:t(21),who:'Creator',what:'Saved version 1'},{at:t(20),who:'Creator',what:'Submitted version 1 for approval'}]},
    {id:'d-s2',sample:true,title:'Launch announcement post',type:'LinkedIn post',status:'Approved',
     versions:[{n:1,text:'Northwind Learn now offers 120 courses with an AI Coach for every learner.',at:t(70),by:'Creator',summary:{high:0,disputed:0,resolved:2,openList:[],disputedList:[]}}],
     comments:[{by:'Reviewer',text:'Facts match F-03. Approved.',at:t(48)}],
     audit:[{at:t(72),who:'Creator',what:'Saved version 1'},{at:t(70),who:'Creator',what:'Submitted version 1 for approval'},{at:t(48),who:'Reviewer',what:'Approved version 1'}]}
  ];
}
function freshSession(){return {docId:null,title:'Northwind Learn launch post',type:'LinkedIn post',text:SAMPLE_DRAFT,ai:[],disputed:{},resolved:[],aiMeta:null};}
function seed(){return {v:2,role:'Creator',tab:'review',rules:seedRules(),docs:seedDocs(),events:seedEvents(),session:freshSession()};}

var S=loadState();
if(!S||S.v!==2)S=seed();
var U={openCard:null,aiBusy:false,aiMsg:'',aiAvail:null,toast:'',selDoc:null,gap:{},gapBusy:null,timer:null};
var TABS=['review','workflow','rules','insights'];
function hashTab(){var h=(location.hash||'').replace('#','');return TABS.indexOf(h)>=0?h:null;}
if(hashTab())S.tab=hashTab();

/* ---------- rule helpers ---------- */
function allRules(){
  var R=S.rules,out=[];
  R.guidelines.forEach(function(g){out.push({id:g.id,kind:'guideline',category:g.category||'Tone',text:g.text});});
  R.terms.forEach(function(t){out.push({id:t.id,kind:'terminology',category:'Terminology',text:t.text});});
  R.facts.forEach(function(f){out.push({id:f.id,kind:'approved fact',category:'Facts',text:f.subject+' is '+f.display+' (owner: '+f.owner+', valid to '+f.expires+')'});});
  R.claims.forEach(function(c){out.push({id:c.id,kind:'claims register',category:'Claims',text:c.text});});
  return out;
}
function ruleById(id){return allRules().find(function(r){return r.id===id;});}
function factStatus(f){return f.expires<TODAY?'expired':(f.expires<=isoPlus(30)?'soon':'current');}
function nextId(prefix,arr){
  var max=0;arr.forEach(function(x){var n=parseInt(x.id.split('-')[1],10);if(n>max)max=n;});
  return prefix+'-'+String(max+1).padStart(2,'0');
}

/* ---------- rule engine (deterministic) ---------- */
function runRules(text,R){
  var out=[];
  function add(f){f.source='rule';if(f.confidence==null)f.confidence=0.95;out.push(f);}
  function iter(re,fn){re.lastIndex=0;var m;while((m=re.exec(text))!==null){if(m[0]===''){re.lastIndex++;continue;}fn(m);}}
  function span(m){return {start:m.index,end:m.index+m[0].length,quote:m[0]};}

  R.guidelines.forEach(function(g){
    if(g.check==='tone'){
      var slang={gonna:'it is going to',wanna:'want to',"super":'very','no-brainer':'easy choice',insane:'remarkable','awesome sauce':'excellent'};
      iter(new RegExp('\\b('+Object.keys(slang).map(escRe).join('|')+')\\b','gi'),function(m){
        var s=span(m);s.ruleId=g.id;s.category='Tone';s.severity='low';
        s.why='"'+m[0]+'" is slang or an intensifier. The tone rule asks for a warm, professional voice.';
        s.suggestion=cap(m[0],slang[m[0].toLowerCase()],text,m.index);add(s);
      });
      var run=0;
      iter(/!+/g,function(m){
        run++;
        if(run>1||m[0].length>1){
          var s=span(m);s.ruleId=g.id;s.category='Tone';s.severity='low';
          s.why=m[0].length>1?'Repeated exclamation marks.':'This is the second exclamation mark in the post. The rule allows one.';
          s.suggestion='.';add(s);
        }
      });
    }
    if(g.check==='absolutes'){
      iter(/\bguarantee[ds]?\s+(?:100\s?%\s+)?/gi,function(m){
        var s=span(m);s.ruleId=g.id;s.category='Claims';s.severity='high';
        s.why='Promising a guaranteed outcome is not allowed. Outcomes depend on the learner.';
        s.suggestion='aim for ';add(s);
      });
      iter(/\b100\s?%\s+(?=[A-Za-z])/gi,function(m){
        var s=span(m);s.ruleId=g.id;s.category='Claims';s.severity='high';
        s.why='"100%" promises a complete outcome. Remove the absolute or cite approved evidence.';
        s.suggestion='';add(s);
      });
      iter(/\brisk[- ]free\b/gi,function(m){
        var s=span(m);s.ruleId=g.id;s.category='Claims';s.severity='high';
        s.why='"Risk-free" is an absolute promise.';s.suggestion='easy to try';add(s);
      });
    }
    if(g.check==='a11y'){
      iter(/<img\b(?![^>]*\balt\s*=)[^>]*>/gi,function(m){
        var s=span(m);s.ruleId=g.id;s.category='Accessibility';s.severity='medium';
        s.why='This image has no alt text, so screen-reader users get nothing.';
        s.suggestion=m[0].replace(/<img\b/i,'<img alt="DESCRIBE THE IMAGE"');s.needsInput=true;add(s);
      });
      iter(/!\[\s*\]\([^)]*\)/g,function(m){
        var s=span(m);s.ruleId=g.id;s.category='Accessibility';s.severity='medium';
        s.why='This image has empty alt text.';
        s.suggestion=m[0].replace(/!\[\s*\]/,'![DESCRIBE THE IMAGE]');s.needsInput=true;add(s);
      });
      iter(/\b(click here|read more)\b/gi,function(m){
        var s=span(m);s.ruleId=g.id;s.category='Accessibility';s.severity='low';
        s.why='Link text should say where the link goes. "'+m[0]+'" means nothing out of context.';
        s.suggestion='Join Northwind Learn';s.needsInput=true;add(s);
      });
    }
    if(g.check==='readability'){
      iter(/[^.!?\n]+[.!?]*/g,function(m){
        var words=m[0].trim().split(/\s+/).filter(Boolean).length;
        if(words>25){
          var lead=m[0].length-m[0].trimStart().length;
          var q=m[0].trim();
          add({ruleId:g.id,category:'Readability',severity:'low',start:m.index+lead,end:m.index+lead+q.length,quote:q,
            why:'This sentence has '+words+' words. The rule asks for under 25.',suggestion:'',adviceOnly:true,confidence:0.9});
        }
      });
    }
  });

  R.terms.forEach(function(t){
    iter(new RegExp('\\b'+t.pattern+'\\b','gi'),function(m){
      var s=span(m);s.ruleId=t.id;s.category='Terminology';s.severity='medium';
      var rep=m[0].replace(new RegExp(t.pattern,'i'),t.good);
      s.suggestion=cap(m[0],rep,text,m.index);
      s.why='"'+m[0]+'" is not the approved term. '+t.text;add(s);
    });
  });

  R.facts.forEach(function(f){
    var norm=function(x){return String(x).replace(/[^\d.]/g,'');};
    var st=factStatus(f);
    iter(new RegExp(f.pattern,'gi'),function(m){
      var s=span(m);s.ruleId=f.id;s.category='Facts';
      var found=m[1]||'';
      if(norm(found)!==norm(f.value)){
        s.severity='high';
        s.why='Approved '+f.subject.toLowerCase()+' is '+f.display+'. The draft says '+found+'.'+(st==='expired'?' This fact expired on '+f.expires+', so the owner ('+f.owner+') must confirm the current value.':'');
        s.suggestion=m[0].replace(found,f.value);
        s.reviewerOnly=st==='expired';
        add(s);
      }else if(st==='expired'){
        s.severity='medium';
        s.why='The figure matches '+f.id+', but that fact expired on '+f.expires+'. Ask '+f.owner+' to reconfirm it before publishing.';
        s.suggestion='';s.adviceOnly=true;s.reviewerOnly=true;s.confidence=0.8;add(s);
      }
    });
  });

  R.claims.forEach(function(c){
    if(c.evidence&&c.evidence.trim())return;
    iter(new RegExp(c.pattern,'gi'),function(m){
      var s=span(m);s.ruleId=c.id;s.category='Claims';s.severity='high';s.reviewerOnly=true;
      s.why=c.label+' claim with no evidence on file. '+c.text;
      s.suggestion=cap(m[0],c.fix,text,m.index);add(s);
    });
  });

  out.sort(function(a,b){return a.start-b.start||(b.end-b.start)-(a.end-a.start);});
  var kept=[],last=-1;
  out.forEach(function(f){if(f.start>=last){kept.push(f);last=f.end;}});
  return kept;
}

function confLabel(f){return f.confidence>=0.8?'High':f.confidence>=0.5?'Medium':'Needs human judgement';}

function recompute(){
  var ss=S.session,rf=runRules(ss.text,S.rules),af=[];
  ss.ai.forEach(function(a){
    var i=ss.text.indexOf(a.quote);if(i<0)return;
    var f=Object.assign({},a,{start:i,end:i+a.quote.length,source:'ai'});
    var clash=rf.concat(af).some(function(r){return r.start<f.end&&f.start<r.end;});
    if(!clash)af.push(f);
  });
  var all=rf.concat(af).sort(function(a,b){return a.start-b.start;});
  var seen={};
  all.forEach(function(f){
    var k=f.ruleId+'|'+f.quote.toLowerCase();seen[k]=(seen[k]||0)+1;
    f.key=k+'|'+seen[k];
    f.status=ss.disputed[f.key]?'disputed':'open';
    f.reason=ss.disputed[f.key]||'';
  });
  ss.findings=all;
}

/* ---------- diff ---------- */
function diffHtml(a,b){
  if(b==='')return '<del>'+esc(a)+'</del>';
  var ta=a.split(/(\s+)/).filter(Boolean),tb=b.split(/(\s+)/).filter(Boolean);
  var n=ta.length,m=tb.length;
  if(n*m>40000)return '<del>'+esc(a)+'</del> <ins>'+esc(b)+'</ins>';
  var dp=[],i,j;
  for(i=0;i<=n;i++){dp.push(new Array(m+1).fill(0));}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)dp[i][j]=ta[i]===tb[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  var out=[];i=0;j=0;
  while(i<n&&j<m){
    if(ta[i]===tb[j]){out.push({t:'s',v:ta[i]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:'d',v:ta[i]});i++;}
    else{out.push({t:'i',v:tb[j]});j++;}
  }
  while(i<n){out.push({t:'d',v:ta[i++]});}
  while(j<m){out.push({t:'i',v:tb[j++]});}
  // treat a space between two changed words as part of the change, then group each change as one deletion and one insertion
  for(var k=1;k<out.length-1;k++){
    if(out[k].t==='s'&&/^\s+$/.test(out[k].v)&&out[k-1].t!=='s'&&out[k+1].t!=='s')out[k].t='c';
  }
  var html='',idx=0;
  while(idx<out.length){
    if(out[idx].t==='s'){html+=esc(out[idx].v);idx++;continue;}
    var dels='',ins='';
    while(idx<out.length&&out[idx].t!=='s'){
      if(out[idx].t!=='i')dels+=out[idx].v;
      if(out[idx].t!=='d')ins+=out[idx].v;
      idx++;
    }
    if(dels.trim())html+='<del>'+esc(dels.trim())+'</del>';
    if(dels.trim()&&ins.trim())html+=' ';
    if(ins.trim())html+='<ins>'+esc(ins.trim())+'</ins>';
  }
  return html;
}

/* ----- insights ----- */
function insightRows(){
  var map={};
  S.events.forEach(function(e){
    var r=map[e.ruleId]||(map[e.ruleId]={ruleId:e.ruleId,category:e.category,total:0,fixed:0,disputed:0,reasons:[]});
    r.total++;
    if(e.outcome==='disputed'){r.disputed++;if(e.reason)r.reasons.push(e.reason);}else r.fixed++;
  });
  return Object.keys(map).map(function(k){var r=map[k];r.rate=r.total?r.disputed/r.total:0;r.gap=r.disputed>=2&&r.rate>=0.5;return r;})
    .sort(function(a,b){return b.disputed-a.disputed||b.total-a.total;});
}
function viewInsights(){
  var ev=S.events,rows=insightRows();
  var tot=ev.length,disp=ev.filter(function(e){return e.outcome==='disputed';}).length;
  var cats={};ev.forEach(function(e){cats[e.category]=(cats[e.category]||0)+1;});
  var catRows=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];});
  var max=Math.max.apply(null,catRows.map(function(k){return cats[k];}).concat([1]));
  var stale=S.rules.facts.filter(function(f){return factStatus(f)!=='current';});
  var gaps=rows.filter(function(r){return r.gap;});
  return '<div class="stack">'+
   '<div class="note">Insights are built from every Accept, Edit and Dispute. '+(ev.some(function(e){return e.sample;})?'The first '+ev.filter(function(e){return e.sample;}).length+' events are sample history so the screens are not empty.':'')+'</div>'+
   '<section class="panel"><div class="kpis">'+
     '<div class="kpi"><b>'+tot+'</b><span>findings resolved</span></div>'+
     '<div class="kpi"><b>'+(tot?Math.round((tot-disp)/tot*100):0)+'%</b><span>fixed by the creator</span></div>'+
     '<div class="kpi"><b>'+(tot?Math.round(disp/tot*100):0)+'%</b><span>disputed</span></div>'+
     '<div class="kpi"><b>'+stale.length+'</b><span>facts expired or expiring</span></div></div></section>'+
   '<div class="grid2">'+
     '<section class="panel"><h3 style="margin-bottom:10px">Recurring mistakes by category</h3><div class="bars">'+
       (catRows.length?catRows.map(function(k){return '<div class="bar-row"><span>'+esc(k)+'</span><div class="track"><div class="fill" style="width:'+Math.round(cats[k]/max*100)+'%"></div></div><span class="mono">'+cats[k]+'</span></div>';}).join(''):'<div class="empty">No history yet.</div>')+
     '</div></section>'+
     '<section class="panel"><h3 style="margin-bottom:10px">Facts that need an owner</h3>'+
       (stale.length?'<ul class="list stack" style="gap:8px">'+stale.map(function(f){var st=factStatus(f);return '<li><span class="chip">'+f.id+'</span> <b>'+esc(f.subject)+'</b> <span class="pill '+(st==='expired'?'high':'medium')+'">'+(st==='expired'?'Expired '+f.expires:'Expires '+f.expires)+'</span><div class="small muted">Owner: '+esc(f.owner)+'</div></li>';}).join('')+'</ul>':'<div class="empty">All facts are current.</div>')+
     '</section></div>'+
   '<section class="panel"><h3>Guideline gaps</h3><p class="small muted" style="margin:2px 0 10px">A rule that creators often dispute is probably unclear. The fix is in the guideline, not the content.</p>'+
     (gaps.length?gaps.map(function(r){
        var rule=ruleById(r.ruleId);
        var g=U.gap[r.ruleId];
        return '<div class="card medium" style="margin-top:10px"><div class="row" style="justify-content:space-between"><div class="row"><span class="chip">'+r.ruleId+'</span><b>Disputed '+Math.round(r.rate*100)+'% of the time</b><span class="small muted">('+r.disputed+' of '+r.total+')</span></div></div>'+
          '<div class="small" style="margin:6px 0">'+esc(rule?rule.text:'')+'</div>'+
          '<div class="sec">What creators said</div><ul class="list small" style="margin-bottom:8px">'+r.reasons.slice(0,4).map(function(x){return '<li>“'+esc(x)+'”</li>';}).join('')+'</ul>'+
          (g?'<div class="note"><div class="sec">Suggested clearer wording (Claude)</div>'+esc(g)+'</div><div class="row" style="margin-top:8px">'+(can().admin?'<button class="btn primary sm" data-action="applyGap" data-id="'+r.ruleId+'">Use this wording</button>':'<span class="small muted">Switch to Admin to apply.</span>')+'</div>':
            (U.aiAvail?'<button class="btn sm" data-action="gap" data-id="'+r.ruleId+'"'+(U.gapBusy===r.ruleId?' disabled':'')+'>'+(U.gapBusy===r.ruleId?'Claude is reading…':'Suggest clearer wording with Claude')+'</button>':'<span class="small muted">Rewrite this rule with examples of what is and is not allowed.</span>'))+
        '</div>';}).join(''):'<div class="empty">No rule is disputed often enough to look unclear.</div>')+
   '</section>'+
   '<section class="panel"><h3 style="margin-bottom:10px">All rules by activity</h3><div class="scroll"><table class="tbl"><thead><tr><th>Rule</th><th>Category</th><th>Resolved</th><th>Fixed</th><th>Disputed</th></tr></thead><tbody>'+
     rows.map(function(r){return '<tr><td><span class="chip">'+r.ruleId+'</span></td><td>'+esc(r.category)+'</td><td>'+r.total+'</td><td>'+r.fixed+'</td><td>'+r.disputed+(r.gap?' <span class="pill medium">Looks unclear</span>':'')+'</td></tr>';}).join('')+'</tbody></table></div></section>'+
  '</div>';
}

/* ---------- actions ---------- */
function toast(msg){
  U.toast=msg;
  ['toast','toast2'].forEach(function(id){var el=$(id);if(el)el.textContent=msg;});
  clearTimeout(toast.t);toast.t=setTimeout(function(){U.toast='';['toast','toast2'].forEach(function(id){var el=$(id);if(el)el.textContent='';});},4000);
}
function refreshPanes(){
  recompute();
  var m=$('marked'),f=$('findings');
  if(m)m.innerHTML=markedHtml();
  if(f)f.innerHTML=findingsHtml();
}
function logEvent(f,outcome,reason){
  S.events.push({ruleId:f.ruleId,category:f.category,outcome:outcome,at:new Date().toISOString(),reason:reason||''});
}
function resolveWith(f,replacement,outcome){
  var ss=S.session;
  ss.text=ss.text.slice(0,f.start)+replacement+ss.text.slice(f.end);
  ss.resolved.push({ruleId:f.ruleId,quote:f.quote,replacement:replacement,outcome:outcome});
  ss.ai=ss.ai.filter(function(a){return a.quote!==f.quote;});
  logEvent(f,outcome);
  U.openCard=null;recompute();saveState();render();
  toast((outcome==='accepted'?'Fix applied':'Your wording applied')+'. Rule '+f.ruleId+' recorded.');
}
function flushPending(){
  if(U.timer){clearTimeout(U.timer);U.timer=null;recompute();render();return true;}
  return false;
}
function currentDoc(){return S.session.docId?S.docs.find(function(d){return d.id===S.session.docId;}):null;}
function addAudit(d,who,what){d.audit.push({at:new Date().toISOString(),who:who,what:what});}

function saveVersion(){
  var ss=S.session;
  if(!ss.title.trim()){toast('Add a title first.');return null;}
  if(!ss.text.trim()){toast('The draft is empty.');return null;}
  recompute();
  var sm=summaryOf();
  var summary={high:sm.high.length,disputed:sm.disputed.length,resolved:ss.resolved.length,
    openList:sm.open.slice(0,8).map(function(x){return {ruleId:x.ruleId,severity:x.severity,quote:x.quote};}),
    disputedList:sm.disputed.map(function(x){return {ruleId:x.ruleId,quote:x.quote,reason:x.reason};})};
  var d=currentDoc();
  if(!d){
    d={id:'d-'+Date.now(),title:ss.title.trim(),type:ss.type,status:'Draft',versions:[],comments:[],audit:[]};
    S.docs.push(d);ss.docId=d.id;
  }
  d.title=ss.title.trim();d.type=ss.type;
  var n=d.versions.length+1;
  d.versions.push({n:n,text:ss.text,at:new Date().toISOString(),by:S.role,summary:summary});
  addAudit(d,S.role,'Saved version '+n);
  if(d.status==='Approved'||d.status==='Changes requested'){addAudit(d,'System','Status reset to Draft because the content changed. It needs review again.');d.status='Draft';}
  saveState();
  return d;
}

/* ----- Claude deep check ----- */
var samplePromise=null;
function getSample(){
  if(!samplePromise)samplePromise=(async function(){try{return (window.claude&&window.claude.use)?await window.claude.use('sample'):null;}catch(e){return null;}})();
  return samplePromise;
}
async function runAI(){
  var sample=await getSample();
  if(!sample){U.aiMsg='Deep check with Claude is not available in this view. Rule checks still run.';render();return;}
  var ss=S.session;
  if(!ss.text.trim())return;
  U.aiBusy=true;U.aiMsg='Claude is reading the draft against '+allRules().length+' brand rules. This can take up to a minute.';render();
  var rules=allRules().map(function(r){return {id:r.id,type:r.kind,rule:r.text};});
  var already=ss.findings.filter(function(f){return f.source==='rule';}).map(function(f){return {ruleId:f.ruleId,quote:f.quote};});
  var prompt=
   'You are a brand-compliance reviewer. Review the DRAFT only against the BRAND RULES below. Do not invent rules.\n\n'+
   'BRAND RULES (JSON):\n'+JSON.stringify(rules)+'\n\n'+
   'DRAFT:\n"""\n'+ss.text.slice(0,6000)+'\n"""\n\n'+
   'ALREADY FOUND BY EXACT CHECKS (do not repeat): '+JSON.stringify(already)+'\n\n'+
   'Find judgement issues the exact checks miss: tone that is too casual or pushy, claims that imply a guarantee or ranking without using the exact words, meaning that contradicts an approved fact or rule.\n'+
   'Reply with only a JSON array. Each item: {"ruleId": one id from BRAND RULES, "quote": text copied EXACTLY from the DRAFT, "issue": one sentence, "suggestion": replacement for the quote that keeps the writer\'s intent, "severity": "high"|"medium"|"low", "confidence": number from 0 to 1}. If nothing else is wrong reply [].';
  try{
    var data=await sample.json(prompt,{modelTier:'default'});
    var list=Array.isArray(data)?data:[];
    var kept=[],dropped=0,dup=0;
    list.forEach(function(it){
      var rule=it&&ruleById(String(it.ruleId));
      var q=it&&typeof it.quote==='string'?it.quote:'';
      var idx=q?ss.text.indexOf(q):-1;
      if(!rule||idx<0||!String(it.issue||'').trim()){dropped++;return;}
      var overlapRule=ss.findings.some(function(f){return f.source==='rule'&&f.start<idx+q.length&&idx<f.end;});
      if(overlapRule){dup++;return;}
      var sev=['high','medium','low'].indexOf(it.severity)>=0?it.severity:'medium';
      var conf=Math.max(0,Math.min(1,Number(it.confidence)));if(isNaN(conf))conf=0.5;
      var sug=typeof it.suggestion==='string'?it.suggestion:'';
      var claimish=rule.category==='Claims'||rule.category==='Facts';
      kept.push({ruleId:rule.id,category:rule.category,severity:sev,quote:q,why:String(it.issue),suggestion:sug,adviceOnly:!sug||sug===q,confidence:conf,reviewerOnly:claimish&&sev==='high'});
    });
    ss.ai=kept;
    ss.aiMeta='Claude suggested '+list.length+' issue'+(list.length===1?'':'s')+'. '+kept.length+' passed source verification and are shown below. '+dropped+' were dropped because they cited no real rule or quoted text that is not in the draft'+(dup?', and '+dup+' repeated an exact check':'')+'.';
    U.aiMsg='Deep check finished.';
  }catch(e){
    var code=e&&e.code;
    U.aiMsg=code==='not_granted'?'Claude access was not allowed for this page. Rule checks still run.':
      code==='rate_limited'?'Claude is busy or your usage limit was reached. Try again later.':
      code==='invalid_json'?'Claude replied in an unexpected format. Try again.':'The deep check could not finish. Rule checks still run.';
  }
  U.aiBusy=false;recompute();saveState();render();
}
async function runGap(id){
  var sample=await getSample();if(!sample)return;
  var r=insightRows().find(function(x){return x.ruleId===id;});var rule=ruleById(id);
  U.gapBusy=id;render();
  var prompt='A brand guideline is often disputed by content creators because it is unclear.\nRULE ('+id+'): '+rule.text+'\nCREATOR OBJECTIONS: '+JSON.stringify(r.reasons)+'\n\nRewrite the rule in at most 3 sentences so it is unambiguous. Say exactly what is allowed and what is not, with one short example of each. Reply with only the new rule text.';
  try{var res=await sample(prompt,{modelTier:'default'});U.gap[id]=res.text.trim();}
  catch(e){toast('Claude could not suggest wording right now.');}
  U.gapBusy=null;render();
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-action]');if(!el)return;
  var a=el.dataset.action,i=el.dataset.i!=null?parseInt(el.dataset.i,10):null,id=el.dataset.id;
  var ss=S.session,c=can();
  if(['accept','edit','dispute','applyEdit','applyDispute','reopen'].indexOf(a)>=0&&U.timer){flushPending();toast('The draft changed a moment ago. Check the updated findings and try again.');return;}

  if(a==='tab'){S.tab=el.dataset.tab;location.hash=S.tab;saveState();render();return;}
  if(a==='role'){S.role=el.dataset.role;U.openCard=null;saveState();render();return;}
  if(a==='run'){clearTimeout(U.timer);U.timer=null;recompute();U.aiMsg='';saveState();render();var n=summaryOf().open.length;toast(n?plural(n,'open finding')+' to look at.':'No open findings.');return;}
  if(a==='ai'){runAI();return;}
  if(a==='sample'){nextSample();toast('Sample draft loaded.');return;}
  if(a==='jump'){
    var card=$('card-'+i);if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.classList.add('flash');setTimeout(function(){card.classList.remove('flash');},1200);}return;}
  if(a==='accept'){var f=ss.findings[i];if(f&&c.edit&&!f.adviceOnly&&!f.needsInput)resolveWith(f,f.suggestion,'accepted');return;}
  if(a==='edit'){U.openCard={key:ss.findings[i].key,mode:'edit'};render();return;}
  if(a==='dispute'){U.openCard={key:ss.findings[i].key,mode:'dispute'};render();return;}
  if(a==='cancel'){U.openCard=null;render();return;}
  if(a==='applyEdit'){
    var f2=ss.findings[i],v=$('editBox').value;
    if(!v.trim()&&f2.suggestion!==''){toast('Write the replacement text first.');return;}
    if(/DESCRIBE THE IMAGE/.test(v)){toast('Replace DESCRIBE THE IMAGE with a real description.');return;}
    if(v===f2.quote){toast('That is the same text. Change it or dispute the flag.');return;}
    resolveWith(f2,v,'edited');return;}
  if(a==='applyDispute'){
    var f3=ss.findings[i],r=($('reasonBox').value||'').trim();
    if(r.length<3){toast('Give a short reason so the guideline owner can learn from it.');return;}
    ss.disputed[f3.key]=r;logEvent(f3,'disputed',r);U.openCard=null;recompute();saveState();render();toast('Disputed. A reviewer will see your reason.');return;}
  if(a==='reopen'){var f4=ss.findings[i];delete ss.disputed[f4.key];recompute();saveState();render();return;}
  if(a==='save'){var d=saveVersion();if(d){render();toast('Saved as version '+d.versions.length+'.');}return;}
  if(a==='submit'){
    recompute();var sm=summaryOf();
    if(sm.high.length){toast('Fix or dispute the '+plural(sm.high.length,'high-severity finding')+' first.');return;}
    var d2=saveVersion();if(!d2)return;
    d2.status='In review';addAudit(d2,S.role,'Submitted version '+d2.versions.length+' for approval');
    U.selDoc=d2.id;saveState();S.tab='workflow';location.hash='workflow';render();toast('Submitted. A reviewer can now approve or request changes.');return;}
  if(a==='selDoc'){U.selDoc=id;render();return;}
  if(a==='openDoc'){
    var d3=S.docs.find(function(x){return x.id===id;});var v3=d3.versions[d3.versions.length-1];
    S.session={docId:d3.id,title:d3.title,type:d3.type,text:v3.text,ai:[],disputed:{},resolved:[],aiMeta:null};
    S.tab='review';location.hash='review';recompute();saveState();render();return;}
  if(a==='comment'){
    var box=$('commentBox'),t=(box.value||'').trim();if(!t)return;
    var d4=S.docs.find(function(x){return x.id===id;});d4.comments.push({by:S.role,text:t,at:new Date().toISOString()});addAudit(d4,S.role,'Commented');
    saveState();render();return;}
  if(a==='approve'||a==='changes'){
    var d5=S.docs.find(function(x){return x.id===id;});
    if(!c.approve||d5.status!=='In review')return;
    var n5=d5.versions.length;
    if(a==='approve'){
      var vs=d5.versions[n5-1].summary;
      if(vs.high>0)return;
      d5.status='Approved';addAudit(d5,S.role,'Approved version '+n5);
    }else{
      var cb=$('commentBox'),ct=(cb&&cb.value||'').trim();
      if(!ct){toast('Add a comment saying what to change, then click Request changes.');return;}
      d5.comments.push({by:S.role,text:ct,at:new Date().toISOString()});
      d5.status='Changes requested';addAudit(d5,S.role,'Requested changes on version '+n5);
    }
    saveState();render();return;}
  if(a==='delRule'){
    var R=S.rules;['guidelines','terms','facts','claims'].forEach(function(k){R[k]=R[k].filter(function(x){return x.id!==id;});});
    recompute();saveState();render();return;}
  if(a==='addGuideline'){
    var gt=$('gTitle').value.trim(),gx=$('gText').value.trim();if(!gt||!gx)return;
    S.rules.guidelines.push({id:nextId('G',S.rules.guidelines),title:gt,text:gx,check:null,category:'Tone'});recompute();saveState();render();return;}
  if(a==='addTerm'){
    var av=$('tAvoid').value.trim(),go=$('tGood').value.trim();if(!av||!go)return;
    S.rules.terms.push({id:nextId('T',S.rules.terms),avoid:av,pattern:escRe(av),good:go.replace(/\$/g,'$$$$'),text:'Say "'+go+'", not "'+av+'".'});recompute();saveState();render();return;}
  if(a==='addFact'){
    var fs=$('fSubject').value.trim(),fv=$('fValue').value.trim(),fn=$('fNoun').value.trim(),fo=$('fOwner').value.trim(),fe=$('fExp').value;
    if(!fs||!fv||!fn||!fo||!fe)return;
    S.rules.facts.push({id:nextId('F',S.rules.facts),subject:fs,value:fv,display:fv+' '+fn,pattern:'(\\d[\\d,]*)\\+?\\s+'+escRe(fn),owner:fo,expires:fe});recompute();saveState();render();return;}
  if(a==='addClaim'){
    var cl=$('cLabel').value.trim(),cw=$('cWords').value.split(',').map(function(x){return x.trim();}).filter(Boolean);
    if(!cl||!cw.length)return;
    S.rules.claims.push({id:nextId('C',S.rules.claims),label:cl,pattern:cw.map(escRe).join('|'),evidence:'',fix:'a well-regarded',text:cl+' claims need evidence on file and a reviewer sign-off.'});recompute();saveState();render();return;}
  if(a==='setEvidence'){
    var evb=$('ev-'+id);var cc=S.rules.claims.find(function(x){return x.id===id;});if(cc){cc.evidence=(evb.value||'').trim();recompute();saveState();render();}return;}
  if(a==='reset'){S=seed();U.openCard=null;U.gap={};recompute();saveState();render();return;}
  if(a==='gap'){runGap(id);return;}
  if(a==='applyGap'){
    var gtxt=U.gap[id];if(!gtxt)return;
    var tgt=S.rules.guidelines.find(function(x){return x.id===id;})||S.rules.terms.find(function(x){return x.id===id;})||S.rules.claims.find(function(x){return x.id===id;});
    if(tgt){tgt.text=gtxt;delete U.gap[id];
      S.events=S.events.filter(function(e){return e.ruleId!==id||!e.sample;});
      saveState();render();toast('Rule '+id+' updated. Its sample dispute history was cleared.');}
    return;}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='draft'){
    S.session.text=t.value;S.session.docId=S.session.docId;
    clearTimeout(U.timer);U.timer=setTimeout(function(){U.timer=null;refreshPanes();saveState();},350);
  }else if(t.id==='title'){S.session.title=t.value;saveState();}
});
document.addEventListener('change',function(ev){if(ev.target.id==='ctype'){S.session.type=ev.target.value;saveState();}});
window.addEventListener('hashchange',function(){var h=hashTab();if(h&&h!==S.tab){S.tab=h;render();}});

/* ---------- start ---------- */
recompute();
render();
getSample().then(function(s){U.aiAvail=!!s;if(S.tab==='review'||S.tab==='insights'){var ae=document.activeElement;if(!(ae&&ae.id==='draft'))render();}});
})();
</script>
